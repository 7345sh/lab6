<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки</title>
    <!-- Bootstrap 5 через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">📝 Заметки</h1>
            <a href="{{ url_for('add') }}" class="btn btn-primary">Добавить</a>
        </div>

        {% if notes %}
        <div class="row g-3">
            {% for note in notes %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">{{ note.title }}</h5>
                        <p class="card-text text-muted">{{ note.content }}</p>
                    </div>
                    <div class="card-footer bg-white d-flex gap-2">
                        <a href="{{ url_for('edit', id=note.id) }}" class="btn btn-sm btn-outline-secondary">Редактировать</a>
                        <a href="{{ url_for('delete', id=note.id) }}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Удалить заметку?')">Удалить</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="alert alert-secondary">Заметок пока нет. Нажмите «Добавить», чтобы создать первую.</div>
        {% endif %}
    </div>
</body>
</html>
